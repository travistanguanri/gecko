<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Snapshot</title>
  <link rel="icon" href="icon32.png">
  <link rel="stylesheet" href="form.css?v=1792314829">
</head>
<body class="probe-page probe-site" data-page="form">
<!-- The form tab. The app helper opens it when Claude, ChatGPT or VS Code is
     used as an app and a form is due. The Snapshot extension draws the form over
     this page and fills in the two lines below from the sheet. What is written
     here only shows in a browser that does not have Snapshot. -->
<main hidden>
  <h1 class="probe-title" id="title">Snapshot isn't in this browser</h1>
  <p class="probe-lead" id="note">Open this link in Chrome, where you added Snapshot.</p>

  <!-- Only when the helper is linked to an older sign-up than the one in this
       Chrome (Snapshot was removed and added again): the line that links it to
       this one, for the laptop the helper is running on. -->
  <div id="relink" hidden>
    <div id="relink-mac">
      <p class="probe-note" id="relink-mac-label"></p>
      <code id="relink-mac-line"></code>
    </div>
    <div id="relink-windows">
      <p class="probe-note" id="relink-windows-label"></p>
      <code id="relink-windows-line"></code>
    </div>
    <p id="relink-after"></p>
  </div>
  <!-- Only when Snapshot is here but nobody has signed up in it yet -->
  <p id="unsigned" hidden><a class="probe-submit" id="unsigned-link"></a></p>
</main>
<script src="site.js?v=1792314829"></script>
</body>
</html>
