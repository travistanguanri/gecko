<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pause</title>
  <link rel="icon" href="icon32.png">
  <link rel="stylesheet" href="form.css?v=1791959936">
</head>
<body class="probe-page probe-site" data-page="report">
<!-- One person's numbers for one discussion, shown when they switch off.
     All wording comes from the Copy tab of the sheet. -->
<p id="offline" hidden>Couldn't load your report. Check your internet and reload this page.</p>
<main id="page" hidden>
  <h1 class="probe-title probe-greeting" id="heading"></h1>
  <!-- Read as one sentence: "You reached for AI / 2 times across 24 min of
       discussion / with Claude". The two lines around the number share a style. -->
  <p class="probe-figure-label" data-copy="report_reached"></p>
  <div class="probe-tally">
    <p class="probe-figure"><span id="moments"></span> <span id="moments-unit"></span></p>
    <p class="probe-figure-label" id="length"></p>
  </div>
  <p class="probe-lead" id="tools"></p>

  <!-- The wrap-up questions (Wrap-up Questions tab), sent straight to the sheet.
       Once sent, a thank-you line takes their place. -->
  <section class="probe-wrapup" id="wrapup" hidden>
    <h2 data-copy="report_wrapup_heading"></h2>
    <div id="wrapup-form"></div>
    <p class="probe-lead" id="wrapup-done" data-copy="report_wrapup_done" hidden></p>
  </section>

  <p class="probe-note" data-copy="report_thanks"></p>
  <p class="probe-note"><a href="./" data-copy="report_link"></a></p>
</main>
<script src="config.js?v=1791959936"></script>
<script src="form.js?v=1791959936"></script>
<script src="site.js?v=1791959936"></script>
</body>
</html>
